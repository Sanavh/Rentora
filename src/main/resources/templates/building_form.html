<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <title>Add Building</title>
	</head>
	<br>
		<h2>Add New Building</h2>
		
		<form th:action="@{/buildings/save}" th:object = "${building}" method="post">
			
			<!-- hidden ID for update -->
			<input type="hidden" th:field="*{id}"/>
			
			<label>Name:</label>
			<input type="text" th:field="*{name}"placeholder="Building Name" required/>
			</br></br>
			
			<label>Address:</label>
			<input type="text" th:field="*{address}" placeholder="Address" required/>
			</br></br>
			
			<label>Number of Rooms:</label>
			<input type="number" th:field="*{totalRooms}" placeholder = "Total number of Rooms in the Building" min="1" required/>
			</br></br>
			
			<button type="submit">Save Building</button>
		</form>
		
		<a th:href="@{/buildings}">Back to List</a>

		</body>		
</html>
